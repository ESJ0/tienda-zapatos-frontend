<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script>
        (function() {
            var base = '/tienda-zapatos-frontend/';
            var path = window.location.pathname;
            var route = path.indexOf(base) === 0 ? path.slice(base.length - 1) : '/';

            if (route === '/' || route === '') {
                route = '/login';
            }

            window.location.replace(
                window.location.origin +
                base +
                '#' +
                route +
                window.location.search +
                window.location.hash
            );
        })();
    </script>
</head>

<body></body>

</html>
